<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Thanksgiving Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@500;600;700;800&display=swap">
<style>
/* Layout: an index, then a page. Home is a contents list grouped by when you cook;
   each recipe opens like the printed original (centered header, hanging-quantity
   ingredients beside a numbered method) and takes red-pen ticks as you cook. */
:root {
  --paper: #F8F8F6;        /* glossy magazine stock */
  --hover: #EEEEEA;
  --ink: #1C1D20;          /* printing black */
  --ink-soft: #5A5D63;
  --done: #85878C;
  --rule: #DEDFDA;
  --rule-strong: #B4B6B1;
  --pen: #C41E2D;          /* the red pen that ticked two recipes */
  --pen-wash: #F8DFE1;
  --pen-veil: rgba(196, 30, 45, .10);
  --on-pen: #FFFFFF;
  --shadow: rgba(28, 29, 32, .22);
  --photo-filter: none;

  --display: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
  --text: "EB Garamond", Garamond, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;

  --fs-label: .78rem;
  --fs-ui: .875rem;
  --fs-small: 1.0625rem;
  --fs-body: 1.1875rem;
  --fs-lede: 1.375rem;
  --fs-entry: 1.25rem;
  --fs-h1: clamp(1.75rem, 1.15rem + 2.4vw, 2.5rem);
  --fs-mast: clamp(2.3rem, 1.1rem + 5.6vw, 4.25rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141517; --hover: #212226; --ink: #ECEBE7; --ink-soft: #A5A7AC; --done: #7D7F84;
    --rule: #2D2F33; --rule-strong: #50535A; --pen: #FF6E72; --pen-wash: #4A2226;
    --pen-veil: rgba(255, 110, 114, .16); --on-pen: #23090B; --shadow: rgba(0, 0, 0, .55);
    --photo-filter: brightness(.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141517; --hover: #212226; --ink: #ECEBE7; --ink-soft: #A5A7AC; --done: #7D7F84;
  --rule: #2D2F33; --rule-strong: #50535A; --pen: #FF6E72; --pen-wash: #4A2226;
  --pen-veil: rgba(255, 110, 114, .16); --on-pen: #23090B; --shadow: rgba(0, 0, 0, .55);
  --photo-filter: brightness(.86);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: var(--fs-body);
  line-height: 1.5;
  font-variant-numeric: oldstyle-nums;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
h1:focus { outline: none; }
.vh {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
.wrap {
  max-width: 62rem;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Franklin carries the UI and titles; keep its figures lining */
.brand, .bar nav a, .back, .entry-title, .entry-meta, .glance dd, .tools, .btn, .n,
.r-body h2, .pager .name, .spot span, .folio, .marked, .legend, .clip span, .onpage summary {
  font-family: var(--display);
  font-variant-numeric: lining-nums;
}

/* Red-pen tick */
.tick { display: block; width: 1.4rem; height: 1.4rem; overflow: visible; flex: none; }
.tick path {
  fill: none; stroke: var(--pen); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1 2; stroke-dashoffset: 1.05;
  transition: stroke-dashoffset .3s cubic-bezier(.3, .7, .4, 1);
}
.tick.on path { stroke-dashoffset: 0; transition: none; }

/* Top bar */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.bar-in {
  max-width: 62rem; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: .6rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.brand {
  display: inline-flex; align-items: center; gap: .45rem;
  font-weight: 700; font-size: .95rem; letter-spacing: -.01em; text-decoration: none; color: var(--ink);
}
.brand .tick { width: 1.1rem; height: 1.1rem; }
.bar nav a {
  font-weight: 600; font-size: var(--fs-ui); color: var(--ink-soft); text-decoration: none;
  padding: .35rem .6rem; border-radius: 4px; white-space: nowrap;
}
.bar nav a:hover { color: var(--ink); background: var(--hover); }
.bar nav a[aria-current="page"] { color: var(--pen); }

/* Home: masthead */
.mast {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "text clip";
  gap: 2rem 3.5rem; align-items: center;
  padding-block: clamp(2rem, 6vw, 4.5rem) clamp(1.75rem, 4vw, 3rem);
}
.mast-text { grid-area: text; min-width: 0; }
.eyebrow {
  margin: 0 0 .8rem; color: var(--pen);
  text-transform: uppercase; letter-spacing: .18em; font-size: var(--fs-label);
}
.mast h1 {
  margin: 0; font-family: var(--display); font-weight: 800; font-size: var(--fs-mast);
  line-height: .98; letter-spacing: -.03em; text-wrap: balance;
}
.lede {
  margin: 1.1rem 0 0; max-width: 33em; color: var(--ink-soft);
  font-size: var(--fs-lede); line-height: 1.4; text-wrap: pretty;
}
.legend {
  display: flex; align-items: center; gap: .5rem; margin: 1.4rem 0 0;
  font-size: var(--fs-ui); color: var(--ink-soft);
}
.clip {
  grid-area: clip; display: grid; justify-items: center; gap: .9rem;
  text-decoration: none; color: var(--ink-soft);
}
.clip img {
  display: block; width: clamp(150px, 18vw, 210px); max-width: 100%; height: auto; border-radius: 2px;
  transform: rotate(2.2deg); filter: var(--photo-filter);
  box-shadow: 0 1px 2px var(--shadow), 0 14px 28px -12px var(--shadow);
  transition: transform .25s ease;
}
.clip:hover img { transform: rotate(.6deg) translateY(-3px); }
.clip span { font-weight: 600; font-size: var(--fs-ui); }
.clip:hover span { color: var(--pen); }

/* Home: groups and entries */
.group { padding-block: 1.75rem 1.25rem; border-top: 1px solid var(--rule); }
.group-head { display: grid; gap: .3rem; margin-bottom: .6rem; }
.group-head h2 { margin: 0; font-style: italic; font-weight: 500; font-size: 1.75rem; line-height: 1.15; }
.group-head p { margin: 0; max-width: 40em; color: var(--ink-soft); font-size: var(--fs-small); }
.entries { list-style: none; margin: 0 0 0 -.25rem; padding: 0; display: grid; }
.entry {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr) 13rem; gap: .25rem 1rem; align-items: start;
  padding: .9rem .75rem .9rem .25rem; border-radius: 6px; color: inherit; text-decoration: none;
}
.entry:hover, .entry:focus-visible { background: var(--hover); }
.entry:hover .entry-title { color: var(--pen); }
.entry .mark { grid-column: 1; justify-self: center; padding-top: .1rem; }
.entry-main { grid-column: 2; min-width: 0; display: grid; gap: .2rem; }
.entry-title { font-weight: 700; font-size: var(--fs-entry); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; }
.yield {
  color: var(--ink-soft); text-transform: uppercase; letter-spacing: .16em; font-size: var(--fs-label);
}
.entry-note { color: var(--ink-soft); font-style: italic; font-size: var(--fs-small); line-height: 1.4; }
.entry-meta {
  grid-column: 3; display: grid; gap: .15rem; justify-items: end; text-align: right;
  padding-top: .2rem; font-size: .8125rem; color: var(--ink-soft);
}
.entry-meta .heat { font-weight: 600; color: var(--ink); }
.entry-meta .prog { font-weight: 600; color: var(--pen); }

/* Recipe page */
.back {
  display: inline-flex; align-items: center; gap: .35rem; margin-top: 1.25rem; padding: .3rem .5rem .3rem 0;
  font-weight: 600; font-size: var(--fs-ui); color: var(--ink-soft); text-decoration: none;
}
.back:hover { color: var(--pen); }
.r-head { display: grid; justify-items: center; gap: .55rem; max-width: 40rem; margin: 1.25rem auto 0; text-align: center; }
.r-head h1 {
  margin: 0; font-family: var(--display); font-weight: 700; font-size: var(--fs-h1);
  line-height: 1.12; letter-spacing: -.015em; text-wrap: balance;
}
.marked { display: inline-flex; align-items: center; gap: .4rem; margin: 0; font-weight: 600; font-size: .8125rem; color: var(--pen); }
.headnote { margin: .35rem 0 0; max-width: 32em; font-style: italic; line-height: 1.45; text-wrap: pretty; }
.aside { margin: .35rem 0 0; max-width: 32em; color: var(--ink-soft); font-size: var(--fs-small); text-wrap: pretty; }
.glance { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem 2.75rem; margin: 1.6rem 0 0; padding: 0; }
.glance div { display: grid; justify-items: center; gap: .1rem; }
.glance dt { color: var(--ink-soft); text-transform: uppercase; letter-spacing: .16em; font-size: var(--fs-label); }
.glance dd { margin: 0; font-weight: 600; font-size: 1rem; }
.relations { margin: 1.1rem auto 0; max-width: 40rem; text-align: center; color: var(--ink-soft); font-size: var(--fs-small); }
.relations a { color: var(--ink); text-decoration-color: var(--pen); text-underline-offset: 3px; }
.relations a:hover { color: var(--pen); }
.relations .sep { margin-inline: .6rem; }

.tools {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem 1.25rem;
  margin-top: 2rem; padding-block: .7rem; border-block: 1px solid var(--rule);
  font-size: .8125rem; color: var(--ink-soft);
}
.progress { margin: 0; }
.progress.active { color: var(--pen); font-weight: 600; }
.tools-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.1rem; }
.switch { display: inline-flex; align-items: center; gap: .45rem; font-weight: 600; color: var(--ink); cursor: pointer; }
.switch input { width: 1rem; height: 1rem; margin: 0; accent-color: var(--pen); }
.btn {
  font: inherit; font-weight: 600; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--rule-strong); border-radius: 4px; padding: .38rem .7rem;
}
.btn:hover { border-color: var(--ink); }
.wake-msg { flex-basis: 100%; margin: 0; color: var(--ink); }

.r-body { display: grid; grid-template-columns: minmax(0, 19.5rem) minmax(0, 1fr); gap: 2rem 3.5rem; margin-top: 2rem; align-items: start; }
.r-body h2 { margin: 0 0 .7rem; font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; }
.ing-list, .steps { list-style: none; margin: 0; padding: 0; display: grid; }
.ing, .step { position: relative; }
.ing label {
  display: grid; grid-template-columns: 1.3rem 2.1em minmax(0, 1fr); column-gap: .55rem; align-items: baseline;
  padding: .3rem .4rem .3rem .2rem; border-radius: 5px; line-height: 1.35; cursor: pointer;
}
.ing label:hover, .step label:hover { background: var(--hover); }
.box {
  position: relative; align-self: start; width: 1.05rem; height: 1.05rem; margin-top: .2em;
  border: 1.5px solid var(--rule-strong); border-radius: 50%; transition: border-color .2s;
}
.box .tick { position: absolute; left: -.05rem; top: -.5rem; width: 1.5rem; height: 1.5rem; }
.q { text-align: right; white-space: nowrap; }
.ing a { text-decoration-color: var(--pen); text-underline-offset: 3px; }
.ing a:hover { color: var(--pen); }
.step label {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr); column-gap: .6rem; align-items: baseline;
  padding: .55rem .5rem .55rem .2rem; border-radius: 6px; cursor: pointer;
}
.n { position: relative; text-align: center; font-weight: 700; font-size: 1.05rem; }
.n .tick { position: absolute; left: .15rem; top: -.15rem; width: 1.65rem; height: 1.65rem; }
.num { transition: opacity .2s; }
.step .t { text-wrap: pretty; }
.when { font-weight: 600; background: linear-gradient(transparent 58%, var(--pen-wash) 58%); padding-inline: .06em; }
input:checked + label .q, input:checked + label .t { color: var(--done); }
input:checked + label .box { border-color: transparent; }
input:checked + label .num { opacity: 0; }
input:checked + label .when { background: none; }
input:checked + label .tick path { stroke-dashoffset: 0; }
input:focus-visible + label { outline: 2px solid var(--pen); outline-offset: 1px; }
.small-note { margin: 0 0 .6rem; color: var(--ink-soft); font-size: var(--fs-small); font-style: italic; }
.mentioned { margin: 0; padding-left: 1.1rem; display: grid; gap: .2rem; }
.mentioned a { text-decoration-color: var(--pen); text-underline-offset: 3px; }

.onpage { margin-top: 2.75rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
.onpage summary { cursor: pointer; padding: .35rem 0; font-weight: 600; font-size: var(--fs-ui); }
.onpage summary:hover { color: var(--pen); }
.crops { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
.crop {
  width: min(100%, 24rem); max-width: 100%; border-radius: 3px; box-shadow: 0 0 0 1px var(--rule);
  background-image: url("images/original-page.jpg"); background-repeat: no-repeat; filter: var(--photo-filter);
}
.onpage .note { margin: .8rem 0 0; color: var(--ink-soft); font-size: var(--fs-small); }
.onpage .note a { color: var(--ink); text-decoration-color: var(--pen); text-underline-offset: 3px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2.5rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
.pager a { display: grid; gap: .1rem; align-content: start; padding: .5rem .5rem; border-radius: 6px; color: var(--ink); text-decoration: none; }
.pager a:hover { background: var(--hover); }
.pager a:hover .name { color: var(--pen); }
.pager .dir { color: var(--ink-soft); text-transform: uppercase; letter-spacing: .16em; font-size: var(--fs-label); }
.pager .name { font-weight: 700; font-size: 1rem; line-height: 1.25; text-wrap: balance; }
.pager .next { grid-column: 2; text-align: right; }

/* Original page view */
.orig-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
.orig-head h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: var(--fs-h1); letter-spacing: -.015em; line-height: 1.12; }
.orig-head p { margin: .35rem 0 0; color: var(--ink-soft); font-size: var(--fs-small); }
.photo-scroll { margin-top: 1.25rem; max-width: 100%; overflow: auto; border-radius: 4px; background: var(--hover); }
.photo { position: relative; width: 100%; max-width: 54rem; margin-inline: auto; }
.photo.zoomed { width: 200%; max-width: none; }
.photo img { display: block; width: 100%; height: auto; filter: var(--photo-filter); }
.spot {
  position: absolute; display: block; border: 2px solid var(--pen); border-radius: 3px;
  text-decoration: none; transition: background-color .15s;
}
.spot:hover, .spot:focus-visible { background: var(--pen-veil); outline: none; box-shadow: 0 0 0 2px var(--pen); }
.spot span {
  position: absolute; left: -2px; top: -2px; max-width: calc(100% + 4px);
  padding: .15rem .35rem; border-radius: 3px 0 3px 0;
  background: var(--pen); color: var(--on-pen); font-weight: 600; font-size: .6875rem; line-height: 1.25;
}

/* Footer */
.foot { margin-top: 3.5rem; border-top: 1px solid var(--rule); }
.foot-in { display: flex; align-items: baseline; gap: 1rem; padding-block: 1.25rem 2.5rem; color: var(--ink-soft); font-size: .95rem; }
.foot-in p { margin: 0; max-width: 40em; }
.folio { font-weight: 800; font-size: .95rem; color: var(--ink); }

@media (min-width: 821px) and (min-height: 720px) {
  .ingredients { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 4rem); }
}
@media (max-width: 820px) {
  .r-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .mast { grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "clip"; gap: 1.5rem; }
  .clip { grid-template-columns: auto minmax(0, 1fr); justify-items: start; align-items: center; gap: 1rem; }
  .clip img { width: 84px; transform: rotate(-2deg); }
  .entry { grid-template-columns: 1.75rem minmax(0, 1fr); padding-right: .5rem; }
  .entry-meta { grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-start; text-align: left; gap: .15rem .9rem; padding-top: .35rem; }
  .glance { gap: .75rem 1.75rem; }
}
@media (max-width: 520px) {
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
}
@media (max-width: 380px) {
  .brand { font-size: .875rem; }
}
@media (prefers-reduced-motion: reduce) {
  .tick path, .clip img, .num, .box { transition: none; }
}
@media print {
  :root { --paper: #FFFFFF; --ink: #000000; --ink-soft: #333333; --done: #555555; }
  .bar, .tools, .pager, .onpage, .back, .foot, .clip { display: none !important; }
  .r-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
}
</style>

</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#"><svg class="tick on" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path pathLength="1" d="M3 13.4c1.8 1 3.3 2.6 4.7 5 .3.5 1 .5 1.3 0C12 12 16.2 6.5 21.5 2.6"/></svg>The Thanksgiving Page</a>
    <nav aria-label="Site"><a href="#original-page" id="nav-original">Original page</a></nav>
  </div>
</header>

<main id="view" class="wrap"></main>

<footer class="foot">
  <div class="wrap foot-in">
    <span class="folio">256</span>
    <p>Transcribed from a photo of the printed page. Total times are estimates based on the steps.</p>
  </div>
</footer>

      yield: "Serves 8",
      teaser: "Vacuum-packed whole cooked chestnuts can be substituted for fresh ones.",
      headnote: "Vacuum-packed whole cooked chestnuts can be substituted for fresh ones. Chestnuts are easiest to peel while hot; peel one at a time, holding in a clean kitchen towel.",
      glance: [["Serves", "8"], ["Oven", "400°F"], ["Time", "About 1¼ hr"]],
      heat: "400°F oven", time: "About 1¼ hr",
      ingredients: [
        ["¾", "pound fresh chestnuts"],
        ["2", "tablespoons unsalted butter"],
        ["1", "tablespoon olive oil"],
        ["2", "pounds brussels sprouts, trimmed and cut in half"],
        ["", "Salt and freshly ground pepper"],
        ["½", "cup cider vinegar"],
        ["¼", "cup sugar"],
        ["¼", "cup Homemade Turkey Stock", "turkey-stock"]
      ],
      steps: [
        "Heat oven to 400°. Using a paring knife or a chestnut knife, cut a large “x” in the shell of each chestnut on one side. Arrange on a baking pan in a single layer, cut side up. Roast until flesh is tender, 20 to 25 minutes. Remove from oven. Immediately remove and discard shells, keeping chestnuts whole if possible. Set chestnuts aside.",
        "Melt butter and oil in a large sauté pan set over medium-high heat. Add brussels sprouts; season with salt and pepper. Cook, stirring occasionally, until golden, 16 to 18 minutes.",
        "Add roasted chestnuts. Cook, gently stirring occasionally, until brussels sprouts are tender and spotted deep brown, 20 to 25 minutes.",
        "Add the vinegar, sugar, and turkey stock. Cook, stirring occasionally, until the liquid has been reduced to a syrup, 4 to 5 minutes. Transfer to a serving dish, and serve."
      ],
      uses: ["turkey-stock"],
      regions: [[0.3846, 0.0863, 0.2706, 0.5329]]
    },
    {
      id: "sweet-potatoes",
      title: "Baked Sweet Potatoes and Pecans",
      group: "day-of",
      checked: true,
      yield: "Serves 8",
      teaser: "Make sure the potatoes are slightly undercooked in the first step since they’ll cook more later.",
      headnote: "Make sure the potatoes are slightly undercooked in the first step since they’ll cook more later.",
      glance: [["Serves", "8"], ["Oven", "400°F"], ["Time", "About 1¾ hr"]],
      heat: "400°F oven", time: "About 1¾ hr",
      ingredients: [
        ["7", "tablespoons unsalted butter, room temperature, plus more for casserole"],
        ["5", "pounds sweet potatoes"],
        ["7", "tablespoons packed dark-brown sugar"],
        ["1½", "teaspoons ground cinnamon"],
        ["", "Pinch of cayenne pepper"],
        ["", "Salt and freshly ground pepper"],
        ["⅔", "cup pecan halves"]
      ],
      steps: [
        "Heat the oven to 400°. Generously butter a 2-quart casserole, and set aside. Bake the potatoes until almost tender, 25 to 30 minutes. Remove potatoes from oven, and set aside until cool enough to handle. Slip off the skins. Cut the potatoes into 1½-inch-thick rounds, and transfer to a large bowl.",
        "Add 5 tablespoons butter, 5 tablespoons brown sugar, cinnamon, and cayenne pepper; season with salt and pepper. Stir to combine; set aside.",
        "Melt the remaining 2 tablespoons of butter in a medium sauté pan set over medium-high heat. Add the remaining 2 tablespoons brown sugar and the pecans. Cook, stirring occasionally, until the pecans have been coated and have caramelized, about 3 minutes.",
        "Add the pecans to the sweet-potato mixture, and gently stir to combine. Transfer to the prepared casserole, and bake, stirring 2 or 3 times, until potatoes are caramelized and bubbly, 30 to 35 minutes. Serve immediately."
      ],
      regions: [[0.3846, 0.6274, 0.2706, 0.2869], [0.6581, 0.0863, 0.2779, 0.2647]]
    },
    {
      id: "garlic-mashed-potatoes",
      title: "Roasted-Garlic Mashed Potatoes",
      group: "day-of",
      yield: "Serves 8",
      teaser: "You can prepare mashed potatoes several hours before dinner.",
      headnote: "You can prepare mashed potatoes several hours before dinner, but only use two-thirds of the cream. Half an hour before serving, place the potatoes in a heat-proof bowl set over a pan of barely simmering water; warm, stirring occasionally, until heated through. Just before serving, mix in the remaining cream.",
      glance: [["Serves", "8"], ["Oven", "425°F"], ["Time", "About 1¼ hr"]],
      heat: "425°F oven", time: "About 1¼ hr",
      ingredients: [
        ["2", "large heads garlic"],
        ["1", "teaspoon olive oil"],
        ["4", "pounds all-purpose Maine potatoes, peeled and quartered"],
        ["", "Salt"],
        ["8", "tablespoons (1 stick) unsalted butter"],
        ["1¼", "cups heavy cream"],
        ["", "Freshly ground pepper"]
      ],
      steps: [
        "Heat oven to 425°. Slice the top ¼ inch off the garlic heads, and discard. Coat heads with olive oil, and wrap heads in aluminum foil. Bake until tender and golden, about 45 minutes. Remove from oven, and let stand until cool enough to handle. Carefully peel garlic cloves; set aside.",
        "Place potatoes in a large stockpot, cover with cold salted water, and bring to a boil. Cook until very tender, about 12 minutes. Drain in a colander, and pass through a potato ricer or food mill over a large bowl.",
        "Heat butter and cream in a saucepan until butter has melted and the cream is hot. Pour over riced potatoes, season with salt and pepper, and stir well to combine. Gently stir in the roasted garlic cloves; serve."
      ],
      regions: [[0.6581, 0.3569, 0.2779, 0.5644]]
    },
    {
      id: "stuffing",
      title: "Stuffing, Continued",
      refName: "the stuffing",
      group: "partial",
      yield: "Partial recipe",
      teaser: "Corn bread, sourdough, prunes, and pears. The first half of the recipe is on the page before.",
      note: "This recipe starts on the page before, which has its title and ingredient list. Only the end made it onto page 256. In a magazine, the page before is printed on the back of this same sheet.",
      heat: "Partial recipe", time: "",
      mentioned: [
        ["Corn Bread", "corn-bread"], ["Sourdough"], ["Vegetables (from step 1)"], ["Herbs"],
        ["Prunes"], ["Pears"], ["Salt and pepper"], ["Butter (the remaining 4 tablespoons)"],
        ["Turkey stock", "turkey-stock"]
      ],
      continues: true,
      steps: [
        "tender, about 10 minutes. Remove from heat.",
        "In a large bowl, combine corn bread and sourdough. Add vegetables, herbs, prunes, and pears; season with salt and pepper.",
        "Melt the remaining 4 tablespoons of butter. Add melted butter and turkey stock to stuffing mixture. Toss to combine; let cool."
      ],
      uses: ["corn-bread", "turkey-stock"],
      regions: [[0.1051, 0.0816, 0.2794, 0.1096]]
    }
  ];

  const GROUPS = [
    { id: "day-before", title: "The day before", note: "The stuffing needs both. The brussels sprouts use ¼ cup of the stock." },
    { id: "day-of", title: "On the day", note: "Three sides for the table. The mashed potatoes can be made a few hours ahead." },
    { id: "partial", title: "From the page before", note: "The last steps of a stuffing recipe that starts on the previous page." }
  ];

  const SPOTS = [
    { id: "stuffing", label: "Stuffing (end)" },
    { id: "corn-bread", label: "Corn Bread" },
    { id: "turkey-stock", label: "Turkey Stock" },
    { id: "chestnuts-sprouts", label: "Chestnuts & Sprouts" },
    { id: "sweet-potatoes", label: "Sweet Potatoes", r: 0 },
    { id: "sweet-potatoes", label: "Sweet Potatoes, cont.", r: 1 },
    { id: "garlic-mashed-potatoes", label: "Mashed Potatoes" }
  ];

  const ORDER = RECIPES.map(r => r.id);
  const byId = Object.fromEntries(RECIPES.map(r => [r.id, r]));
  const view = document.getElementById("view");
  const navOriginal = document.getElementById("nav-original");

  const TICK = '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path pathLength="1" d="M3 13.4c1.8 1 3.3 2.6 4.7 5 .3.5 1 .5 1.3 0C12 12 16.2 6.5 21.5 2.6"/></svg>';
  const TICK_ON = TICK.replace('class="tick"', 'class="tick on"');

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Highlight durations and oven temperatures inside step text
  const WHEN = /\b(\d+[½¼¾]?(?: to \d+)? (?:minutes|hours?)|\d{3}°|overnight)/g;
  const markWhen = s => esc(s).replace(WHEN, '<b class="when">$1</b>');
  const link = id => `<a href="#${id}">${esc(byId[id].refName || byId[id].title)}</a>`;
  const listLinks = ids => ids.length === 1 ? link(ids[0]) : ids.slice(0, -1).map(link).join(", ") + " and " + link(ids[ids.length - 1]);

  // Check-offs live in this browser only
  const KEY = "thanksgiving-page:v1";
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
  const getState = id => ({ i: new Set((store[id] || {}).i || []), s: new Set((store[id] || {}).s || []) });
  function setState(id, st) {
    if (st.i.size || st.s.size) store[id] = { i: [...st.i], s: [...st.s] }; else delete store[id];
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage unavailable: keep in memory */ }
  }

  /* ---------- Home ---------- */
  function entryHTML(r) {
    const st = getState(r.id);
    let prog = "";
    if (st.s.size === r.steps.length) prog = "All steps done";
    else if (st.i.size || st.s.size) prog = `In progress · ${st.s.size} of ${r.steps.length} steps`;
    return `<li><a class="entry" href="#${r.id}">
      <span class="mark">${r.checked ? TICK_ON + '<span class="vh">Checked on the original page.</span>' : ""}</span>
      <span class="entry-main">
        <span class="entry-title">${esc(r.title)}</span>
        <span class="yield">${esc(r.yield)}</span>
        <span class="entry-note">${esc(r.teaser)}</span>
      </span>
      <span class="entry-meta">
        <span class="heat">${esc(r.heat)}</span>
        ${r.time ? `<span>${esc(r.time)}</span>` : ""}
        ${prog ? `<span class="prog">${prog}</span>` : ""}
      </span>
    </a></li>`;
  }

  function renderHome() {
    const groups = GROUPS.map(g => `
      <section class="group" aria-labelledby="g-${g.id}">
        <div class="group-head"><h2 id="g-${g.id}">${esc(g.title)}</h2><p>${esc(g.note)}</p></div>
        <ul class="entries">${RECIPES.filter(r => r.group === g.id).map(entryHTML).join("")}</ul>
      </section>`).join("");
    view.innerHTML = `
      <header class="mast">
        <div class="mast-text">
          <p class="eyebrow">From page 256</p>
          <h1 tabindex="-1">The Thanksgiving Page</h1>
          <p class="lede">Five recipes from a saved magazine page. Make the stock and corn bread the day before, then the three sides on the day. The page also holds the last steps of a stuffing recipe.</p>
          <p class="legend">${TICK_ON}<span>Checked in red pen on the original page</span></p>
        </div>
        <a class="clip" href="#original-page">
          <img src="images/original-page-thumb.jpg" width="520" height="656" alt="Photo of the original magazine page" decoding="async">
          <span>See the original page</span>
        </a>
      </header>
      ${groups}`;
  }

  /* ---------- Recipe ---------- */
  function ingHTML(r, [q, t, to], n, st) {
    const id = `ing-${r.id}-${n}`;
    let text = esc(t);
    if (to) text = text.replace(esc(byId[to].title), `<a href="#${to}">${esc(byId[to].title)}</a>`);
    return `<li class="ing"><input type="checkbox" class="vh" id="${id}" data-kind="i" data-n="${n}"${st.i.has(n) ? " checked" : ""}>
      <label for="${id}"><span class="box">${TICK}</span><span class="q">${esc(q)}</span><span class="t">${text}</span></label></li>`;
  }

  function stepHTML(r, s, n, st) {
    const id = `step-${r.id}-${n}`;
    const text = (n === 0 && r.continues ? "… " : "") + markWhen(s);
    return `<li class="step"><input type="checkbox" class="vh" id="${id}" data-kind="s" data-n="${n}"${st.s.has(n) ? " checked" : ""}>
      <label for="${id}"><span class="n"><span class="num">${n + 1}</span>${TICK}</span><span class="t">${text}</span></label></li>`;
  }

  function cropHTML([l, t, w, h], n, all) {
    const ratio = (w * IMG.w) / (h * IMG.h);
    const label = all.length > 1 ? (n === 0 ? "Start of the recipe as printed" : "The recipe continued in the next column") : "The recipe as printed";
    return `<div class="crop" role="img" aria-label="${label}" style="aspect-ratio:${ratio.toFixed(4)};background-size:${(100 / w).toFixed(3)}% auto;background-position:${(l / (1 - w) * 100).toFixed(3)}% ${(t / (1 - h) * 100).toFixed(3)}%"></div>`;
  }

  function renderRecipe(r) {
    const st = getState(r.id);
    const i = ORDER.indexOf(r.id);
    const prev = byId[ORDER[i - 1]], next = byId[ORDER[i + 1]];
    const rel = [];
    if (r.uses) rel.push(`Uses ${listLinks(r.uses)}`);
    if (r.usedIn) rel.push(`Used in ${listLinks(r.usedIn)}`);

    const left = r.ingredients
      ? `<h2 id="h-ing">Ingredients</h2><ul class="ing-list">${r.ingredients.map((x, n) => ingHTML(r, x, n, st)).join("")}</ul>`
      : `<h2 id="h-ing">Mentioned in the steps</h2><p class="small-note">The full ingredient list is on the page before.</p>
         <ul class="mentioned">${r.mentioned.map(([t, to]) => `<li>${to ? `<a href="#${to}">${esc(t)}</a>` : esc(t)}</li>`).join("")}</ul>`;

    view.innerHTML = `
      <article class="recipe">
        <a class="back" href="#">← All recipes</a>
        <header class="r-head">
          ${r.checked ? `<p class="marked">${TICK_ON}<span>Checked in red pen on the original page</span></p>` : ""}
          <h1 tabindex="-1">${esc(r.title)}</h1>
          <p class="yield">${esc(r.yield)}</p>
          ${r.headnote ? `<p class="headnote">${esc(r.headnote)}</p>` : ""}
          ${r.note ? `<p class="aside">${esc(r.note)}</p>` : ""}
        </header>
        ${r.glance ? `<dl class="glance">${r.glance.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
        ${rel.length ? `<p class="relations">${rel.join('<span class="sep" aria-hidden="true">·</span>')}</p>` : ""}
        <div class="tools">
          <p class="progress" id="progress"></p>
          <div class="tools-actions">
            ${"wakeLock" in navigator ? `<label class="switch"><input type="checkbox" id="wake"${wakeWanted ? " checked" : ""}>Keep screen on</label>` : ""}
            <button type="button" class="btn" id="clear">Clear checks</button>
          </div>
          <p class="wake-msg" id="wake-msg" hidden></p>
        </div>
        <div class="r-body">
          <section class="ingredients" aria-labelledby="h-ing">${left}</section>
          <section class="method" aria-labelledby="h-method">
            <h2 id="h-method">Method</h2>
            <ol class="steps">${r.steps.map((s, n) => stepHTML(r, s, n, st)).join("")}</ol>
          </section>
        </div>
        <details class="onpage">
          <summary>Compare with the printed page</summary>
          <div class="crops">${r.regions.map(cropHTML).join("")}</div>
          <p class="note">Cropped from the photo. <a href="#original-page">See the whole page</a></p>
        </details>
        <nav class="pager" aria-label="More recipes">
          ${prev ? `<a class="prev" href="#${prev.id}"><span class="dir">Previous</span><span class="name">${esc(prev.title)}</span></a>` : ""}
          ${next ? `<a class="next" href="#${next.id}"><span class="dir">Next</span><span class="name">${esc(next.title)}</span></a>` : ""}
        </nav>
      </article>`;
    updateProgress(r);
  }

  function updateProgress(r) {
    const el = document.getElementById("progress");
    if (!el) return;
    const st = getState(r.id);
    if (!st.i.size && !st.s.size) {
      el.textContent = r.ingredients ? "Tap an ingredient or step to check it off." : "Tap a step to check it off.";
      el.classList.remove("active");
      return;
    }
    const parts = [];
    if (r.ingredients) parts.push(`${st.i.size} of ${r.ingredients.length} ingredients`);
    parts.push(`${st.s.size} of ${r.steps.length} steps`);
    el.textContent = "Checked: " + parts.join(" · ");
    el.classList.add("active");
  }

  /* ---------- Original page ---------- */
  function renderOriginal() {
    const spots = SPOTS.map(s => {
      const [l, t, w, h] = byId[s.id].regions[s.r || 0];
      return `<a class="spot" href="#${s.id}" style="left:${(l * 100).toFixed(2)}%;top:${(t * 100).toFixed(2)}%;width:${(w * 100).toFixed(2)}%;height:${(h * 100).toFixed(2)}%"><span>${esc(s.label)}</span></a>`;
    }).join("");
    view.innerHTML = `
      <section class="original">
        <a class="back" href="#">← All recipes</a>
        <div class="orig-head">
          <div>
            <h1 tabindex="-1">The original page</h1>
            <p>Page 256, as photographed. Tap a recipe on the page to open it.</p>
          </div>
          <button type="button" class="btn" id="zoom" aria-pressed="false">Zoom in</button>
        </div>
        <div class="photo-scroll">
          <div class="photo" id="photo">
            <img src="images/original-page.jpg" width="${IMG.w}" height="${IMG.h}" alt="Photo of the magazine page: five Thanksgiving recipes and the end of a stuffing recipe, with red pen checks beside two titles">
            ${spots}
          </div>
        </div>
      </section>`;
  }

  /* ---------- Keep screen on ---------- */
  let wakeLock = null, wakeWanted = false;
  function showWakeMsg(t) {
    const m = document.getElementById("wake-msg");
    if (m) { m.textContent = t; m.hidden = !t; }
  }
  async function setWake(on) {
    wakeWanted = on;
    showWakeMsg("");
    if (!on) {
      const l = wakeLock; wakeLock = null;
      try { if (l) await l.release(); } catch (e) { /* already released */ }
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) {
      wakeWanted = false; wakeLock = null;
      const box = document.getElementById("wake");
      if (box) box.checked = false;
      showWakeMsg("This browser won’t keep the screen on from here. You can lengthen the screen timeout in your device settings instead.");
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (wakeWanted && !wakeLock && document.visibilityState === "visible") setWake(true);
  });

  /* ---------- Events ---------- */
  let current = null;
  view.addEventListener("change", e => {
    const x = e.target;
    if (x.id === "wake") { setWake(x.checked); return; }
    if (!current || !x.dataset.kind) return;
    const st = getState(current.id);
    const set = st[x.dataset.kind], n = Number(x.dataset.n);
    if (x.checked) set.add(n); else set.delete(n);
    setState(current.id, st);
    updateProgress(current);
  });
  view.addEventListener("click", e => {
    if (e.target.closest("#clear") && current) {
      setState(current.id, { i: new Set(), s: new Set() });
      view.querySelectorAll("input[data-kind]").forEach(x => { x.checked = false; });
      updateProgress(current);
    }
    const z = e.target.closest("#zoom");
    if (z) {
      const p = document.getElementById("photo");
      const on = !p.classList.contains("zoomed");
      p.classList.toggle("zoomed", on);
      z.setAttribute("aria-pressed", String(on));
      z.textContent = on ? "Zoom out" : "Zoom in";
    }
  });

  /* ---------- Routing (#recipe-id, #original-page) ---------- */
  let homeY = 0;
  window.addEventListener("scroll", () => { if (view.dataset.view === "home") homeY = window.scrollY; }, { passive: true });

  function route(initial) {
    const id = location.hash.replace(/^#/, "");
    const r = byId[id];
    let kind;
    if (r) { current = r; kind = "recipe"; renderRecipe(r); document.title = `${r.title} · The Thanksgiving Page`; }
    else if (id === "original-page") { current = null; kind = "original"; renderOriginal(); document.title = "The original page · The Thanksgiving Page"; }
    else { current = null; kind = "home"; renderHome(); document.title = "The Thanksgiving Page"; }
    view.dataset.view = kind;
    if (kind === "original") navOriginal.setAttribute("aria-current", "page"); else navOriginal.removeAttribute("aria-current");
    if (!initial) {
      window.scrollTo(0, kind === "home" ? homeY : 0);
      const h = view.querySelector("h1");
      if (h) h.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", () => route(false));
  route(true);
})();
</script>
</body>
</html>
